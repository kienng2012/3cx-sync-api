<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quay Thưởng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <style>
        /*
        body {font-family: Arial, Helvetica, sans-serif;}

        /* The popup form - hidden by default */
        .form-popup {
            display: none;
            position: fixed;
            bottom: 0;
            right: 15px;
            border: 3px solid #f1f1f1;
            z-index: 9;
            width: 100%;
            height: 100%;
        }

        /* Add styles to the form container */
        .form-container {
            max-width: 300px;
            padding: 10px;
            background-color: white;
            /** Them */
            margin: auto;
            margin-top: 500px;
        }

        /* Full-width input fields */
        .form-container input[type=text], .form-container input[type=password] {
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            border: none;
            background: #f1f1f1;
        }

        /* When the inputs get focus, do something */
        .form-container input[type=text]:focus, .form-container input[type=password]:focus {
            background-color: #ddd;
            outline: none;
        }

        /* Set a style for the submit/login button */
        .form-container .btn {
            background-color: #04AA6D;
            color: white;
            padding: 16px 20px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        /* Add a red background color to the cancel button */
        .form-container .cancel {
            background-color: red;
        }

        /* Add some hover effects to buttons */
        .form-container .btn:hover, .open-button:hover {
            opacity: 1;
        }
    </style>
    <script>
        function openForm() {
            document.getElementById("myForm").style.display = "block";
        }

        function closeForm() {
            document.getElementById("myForm").style.display = "none";
        }

        function approveLuckyStamp() {
            // const stampCode = document.getElementById("stampCodeLucky");
            const stampCode = $('#stampCodeLucky').val();

            // var dataValue = "{maTem:"+ stampCode+"}";
            const dataValue = JSON.stringify({"maTem": stampCode});
            alert(dataValue);
            $.ajax({
                /* type: "POST",*/
                /*url: "https://api.mobilebranding.vn/api/SMSBrandname/SendSMS",*/
                type: "POST",
                url: "/api/makeLuckyByStampCode",
                data: dataValue,
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    alert("Request: " + XMLHttpRequest.toString() + "\n\nStatus: " + textStatus + "\n\nError: " + errorThrown);
                },
                success: function (result) {
                    alert("Call success");
                    closeForm();
                    document.getElementById("msgUpdate").innerHTML = "Cập nhật dữ liệu thành công!";
                }
            });
        }

        function rejectLuckyStamp() {
            closeForm();//TODO:
        }
    </script>

</head>
<body>
<section class="random-main">
    <div class="container py-5">
        <div class="d-flex justify-content-center">
            <img class="w-100" src="images/anhlogo.png" alt>
        </div>
        <div class="fw-bold mb-4 random-title text-center">CHƯƠNG TRÌNH
            TRAO THƯỞNG <br>
            CÀO TEM CHỐNG GIẢ - NHẬN NGAY MAY MẮN
        </div>
        <div class="number-slot" id="number-slot">
            <!-- Các cột số sẽ được tạo bằng JS -->
        </div>
        <div class="random-button-main">
            <select name="typePrize" id="typePrize">
                <option value="0" selected="selected">-- Chọn giải --</option>
                <option value="1">-- Giải nhất --</option>
                <option value="2">-- Giải nhì --</option>
                <option value="3">-- Giải ba --</option>
                <option value="4">-- Giải khuyến khích --</option>
            </select>
            <div class="random-button" id="random-button">QUAY</div>
        </div>

        <div class="radom-infor-main container">
            <div class="radom-infor" id>
                <p class="radom-infor-phone"></p>
                <p class="radom-infor-date"></p>
                <p class="radom-infor-product"></p>
                <p class="radom-infor-company"></p>


                <button type="button" class="btn" onclick="makeLuckyStamp()">Xác nhận</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Từ chối</button>

            </div>
        </div>
        <!-- for popup result vtrue -->
        <div class="form-popup" id="myForm">
            <span id="resultQuayThuong"></span>
            <input type="hidden" id="stampCodeLucky" name="stampCodeLucky">
            <span id="msgUpdate"></span>
            <form class="form-container">
                <br>
                <h1>Chúc mừng:</h1>

                Số điện thoại <span id="SoDTKH"></span>
                <br>
                Ngày xác thực :
                <span id="thoiGianXacThuc"></span>
                <br/>
                Tên sản phẩm ?
                <br/>
                thuộc doanh nghiệp ?
                <button type="button" class="btn" onclick="approveLuckyStamp()">Xác nhận</button>
                <button type="button" class="btn cancel" onclick="rejectLuckyStamp()">Tiến hành quay lại</button>
            </form>
        </div>
    </div>
</section>

<script>
    const NUM_COLUMNS = 10;
    const numberSlot = document.getElementById("number-slot");
    const randomButton = document.getElementById("random-button");

    //For SPACE press to get lucky
    document.body.onkeyup = function (e) {
        if (e.key == " " ||
            e.code == "Space" ||
            e.keyCode == 32
        ) {
            if (randomButton.style.display != "none") {
                startRandom();
            }
            //For ESC to restart
        } else if (e.key == "Escape" ||
            e.code == "Escape" ||
            e.keyCode == 27
        ) {
            // alert("Reset now ...")
            if (randomButton.style.display == "none") {
                resetRandom();
            }
        }
    }

    function intNumberColumns() {
        numberSlot.innerHTML = "";
        for (let i = 0; i < NUM_COLUMNS; i++) {
            const column = document.createElement("div");
            column.className = "number-column";
            column.textContent = "0";
            numberSlot.appendChild(column);
        }
    }

    function randomNumberColumns() {
        numberSlot.innerHTML = "";
        // alert("random now")
        for (let i = 0; i < NUM_COLUMNS; i++) {
            const column = document.createElement("div");
            column.className = "number-column";
            column.textContent = Math.floor(Math.random() * 10);
            numberSlot.appendChild(column);
        }
    }

    function processSecretPhone(phone) {
        const newPhone = phone.indexOf('84') == 0 ? phone.replace('84', '0') : phone;
        //alert(newPhone);
        return newPhone.substring(0, 4) + "***" + newPhone.substring(7, 11);
    }

    function formatDateStr(dateStr) {
        //alert(dateStr);
        var date = new Date(dateStr);
        // alert(date);
        var year = date.getFullYear().toString();
        var month = (date.getMonth() + 101).toString().substring(1);
        var day = (date.getDate() + 100).toString().substring(1);
        return day + "-" + month + "-" + year;

    }

    function fillNumberColumns(str) {
        numberSlot.innerHTML = "";
        for (let i = 0; i < str.length; i++) {
            // alert(str.charAt(i));
            const column = document.createElement("div");
            column.className = "number-column";
            column.textContent = str.charAt(i);
            numberSlot.appendChild(column);
            // container.innerHTML += "<div class=\"number-column\">${str.charAt(i)}</div>";
            // setTimeout(1000)//For sleep
        }
    }

    function resetRandom() {
        intNumberColumns();
        randomButton.style.display = "flex";
        randomButton.innerHTML = "QUAY";
        document.querySelector(".radom-infor-main").classList.remove("show");
        document.querySelector(".random-button-main").classList.remove("show");
    }

    function startRandom() {
        const columns = document.querySelectorAll(".number-column");
        const finalNumbers = Array.from({length: NUM_COLUMNS}, () => Math.floor(Math.random() * 10));
        let intervals = [];

        if (randomButton.innerHTML == 'QUAY') {
            // alert('vao quay thuong');
            // document.getElementById("resultQuayThuong").innerHTML = "";
            randomButton.innerHTML = 'DỪNG';
            // myInterval = setInterval(myTimerLucky, 20); //Thiet lap toc do quay cua so . cang nho cang nhanh
            myInterval = setInterval(randomNumberColumns, 50); //Thiet lap toc do quay cua so . cang nho cang nhanh
            //https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_popup_form
            // document.getElementById("myForm").style.display = "none";
            closeForm();
        } else if (randomButton.innerHTML = 'DỪNG') {
            var dataValue = {"to": "begin"};
            $.ajax({
                /* type: "POST",*/
                /*url: "https://api.mobilebranding.vn/api/SMSBrandname/SendSMS",*/
                type: "GET",
                url: "/api/getRandomLucky?typeLoad=Ajax&typeAction=1",
                data: dataValue,
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    clearInterval(myInterval);
                    alert("Request: " + XMLHttpRequest.toString() + "\n\nStatus: " + textStatus + "\n\nError: " + errorThrown);
                },
                success: function (result) {
                    // randomButton.prop("disabled", true);
                    randomButton.style.display = "none";
                    // alert("We returned: " + result.maTem);
                    clearInterval(myInterval);
                    // var parsedData = JSON.parse(result);
                    // document.getElementById("number-slot").innerHTML = parsedData.status;
                    // document.getElementById("number-slot").innerHTML = result.maTem;
                    // alert(result.maTem)
                    fillNumberColumns(result.maTem);
                    document.querySelector(".radom-infor-main").classList.add("show");
                    document.querySelector(".radom-infor-phone").innerHTML = "Số điện thoại: " + processSecretPhone(result.soDienThoai);
                    document.querySelector(".radom-infor-date").innerHTML = "Thời gian xác thực: " + formatDateStr(result.ngayXacThuc);
                    document.querySelector(".radom-infor-product").innerHTML = "Sản phẩm: " + result.tenSP;
                    if (result.tenDN != null && result.tenDN != "" && result.tenDN != "null") {
                        document.querySelector(".radom-infor-company").innerHTML = "Thuộc: " + result.tenDN;
                    }
                    document.querySelector(".random-button-main").classList.add("show");
                    openForm();
                }
            });
            randomButton.value = 'QUAY';

            /*
            columns.forEach((column, index) => {
                let currentNumber = 0;

                const interval = setInterval(() => {
                    currentNumber = (currentNumber + 1) % 10;
                    column.textContent = currentNumber;
                }, 100);

                intervals.push(interval);
                setTimeout(() => {
                    clearInterval(interval);
                    column.textContent = finalNumbers[index];
                    if (index === columns.length - 1) {
                        randomButton.style.display = "none";
                        document.querySelector(".radom-infor-main").classList.add("show");
                        document.querySelector(".random-button-main").classList.add("show");
                    }
                }, 5500 + index * 300);
            });

             */
        }
    }

    randomButton.addEventListener("click", startRandom);
    intNumberColumns();
</script>
</body>
</html>
