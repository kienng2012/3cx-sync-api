<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quay Thưởng</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="main.css">

</head>
<body>
<section class="random-main">
    <div class="container py-5">
        <div class="d-flex justify-content-center">
            <img class="w-100" src="images/anhlogo.png" alt>
        </div>
        <div class="fw-bold mb-4 random-title text-center">CHƯƠNG TRÌNH
            TRAO THƯỞNG <br>
            CÀO TEM CHỐNG GIẢ - NHẬN NGAY MAY MẮN</div>
        <div class="number-slot" id="number-slot">
            <!-- Các cột số sẽ được tạo bằng JS -->
        </div>
        <div class="random-button-main">
            <div class="random-button" id="random-button">QUAY</div>
        </div>

        <div class="radom-infor-main container">
            <div class="radom-infor" id>
                <p class="radom-infor-phone">Số điện thoại:
                    0941***488</p>
                <p class="radom-infor-date">Thời gian xác thực:
                    02/12/2024 20:43:25</p>
            </div>
        </div>
    </div>
</section>

<script>
    const NUM_COLUMNS = 10;
    const numberSlot = document.getElementById("number-slot");
    const randomButton = document.getElementById("random-button");
    function createNumberColumns() {
        for (let i = 0; i < NUM_COLUMNS; i++) {
            const column = document.createElement("div");
            column.className = "number-column";
            column.textContent = "0";
            numberSlot.appendChild(column);
        }
    }


    function startRandom() {
        const columns = document.querySelectorAll(".number-column");
        const finalNumbers = Array.from({ length: NUM_COLUMNS }, () => Math.floor(Math.random() * 10));
        let intervals = [];

        columns.forEach((column, index) => {
            let currentNumber = 0;

            const interval = setInterval(() => {
                currentNumber = (currentNumber + 1) % 10;
                column.textContent = currentNumber;
            }, 100);

            intervals.push(interval);
            setTimeout(() => {
                clearInterval(interval);
                column.textContent = finalNumbers[index];
                if (index === columns.length - 1) {
                    randomButton.style.display = "none";
                    document.querySelector(".radom-infor-main").classList.add("show");
                    document.querySelector(".random-button-main").classList.add("show");
                }
            }, 5500 + index * 300);
        });
    }
    randomButton.addEventListener("click", startRandom);
    createNumberColumns();
</script>
</body>
</html>
